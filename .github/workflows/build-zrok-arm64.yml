name: Build Windows ARM64

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'zrok tag to build (e.g. v2.0.4)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag to build
        id: tag
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            TAG="$(curl -sSfL https://api.github.com/repos/openziti/zrok/releases/latest | jq -r '.tag_name')"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if already built
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VER="${TAG#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo ${{ github.repository }} --json tagName --jq '.tagName' &>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - run: echo hello
